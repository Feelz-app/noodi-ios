workflows:
  noodi_ios_release:
    name: Noodi iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "com.noodi.app"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install NPM dependencies
        script: |
          npm install

      - name: Install Capacitor iOS platform
        script: |
          npm install @capacitor/ios @capacitor/core @capacitor/cli

      - name: Sync iOS project
        script: |
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
          cd ../..

      - name: Build IPA
        script: |
          xcode-project use-profiles
          if [ -d "ios/App/App.xcodeproj" ]; then
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App"
          else
            echo "iOS project not found after sync"
            find ios -maxdepth 4 -type f | head -n 100
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
