workflows:
  noodi_ios_release:
    name: Noodi iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "com.noodi.app"
      node: 22
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.noodi.app

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Sync Capacitor iOS
        script: |
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
          cd ../..

      - name: Build IPA
        script: |
          xcode-project use-profiles
          if [ -d "ios/App/App.xcodeproj" ]; then
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App"
          elif [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "App"
          else
            echo "iOS project/workspace not found after sync"
            find ios -maxdepth 4 -type f | head -n 200
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
