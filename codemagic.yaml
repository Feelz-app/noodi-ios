workflows:
  noodi_ios_release:
    name: Noodi iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.noodi.app
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Sync iOS project
        script: |
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
          cd ../..

      - name: Build IPA
        script: |
          xcode-project use-profiles
          if [ -d "ios/App/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace "ios/App/App/App.xcworkspace" --scheme "App"
          elif [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
          elif [ -d "ios/App/App.xcodeproj" ]; then
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
          elif [ -d "ios/App/App/App.xcodeproj" ]; then
            xcode-project build-ipa --project "ios/App/App/App.xcodeproj" --scheme "App"
          else
            echo "Could not find iOS workspace/project"
            find ios -maxdepth 6 -type d | sort
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
  app_store_connect:
    auth: integration
    submit_to_testflight: false
    submit_to_app_store: false
